name: captain-obvious check
description: Fail if the PR introduces proven can-never-fail tests (report-only)
inputs:
  path:
    default: "."
  base:
    default: "origin/main"
runs:
  using: composite
  steps:
    - run: python3 "${{ github.action_path }}/skills/captain-obvious/scripts/captain_obvious_py.py" --path "$CO_PATH" --no-types --check --base "$CO_BASE"
      shell: bash
      env:
        CO_PATH: ${{ inputs.path }}
        CO_BASE: ${{ inputs.base }}
    - run: node "${{ github.action_path }}/skills/captain-obvious/scripts/captain_obvious_ts.mjs" --project "$CO_PATH" --check --base "$CO_BASE"
      shell: bash
      env:
        CO_PATH: ${{ inputs.path }}
        CO_BASE: ${{ inputs.base }}
